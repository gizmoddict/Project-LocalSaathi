# ==============================================================================
# LocalSaathi Production Redis Configuration (redis.production.conf)
# Durable Queue Protection, Memory Limits, AOF Persistence & Command Hardening
# ==============================================================================

# Network & Port
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Security: Mandatory Authentication
requirepass REPLACE_WITH_STRONG_PRODUCTION_REDIS_PASSWORD

# Persistence: AOF (Append Only File) for BullMQ Queue Durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory Management
# CRITICAL: 'noeviction' ensures that BullMQ queues and outbox tasks are never silently deleted
maxmemory 2gb
maxmemory-policy noeviction

# Command Hardening: Disable or rename dangerous commands in production
rename-command FLUSHALL "SECURE_ADMIN_FLUSHALL_DISABLED"
rename-command FLUSHDB  "SECURE_ADMIN_FLUSHDB_DISABLED"
rename-command DEBUG    ""
rename-command KEYS     "SECURE_ADMIN_KEYS_DISABLED"

# Slow Query Logging
slowlog-log-slower-than 10000 # 10 milliseconds
slowlog-max-len 128
