# ==============================================================================
# LocalSaathi Production PostgreSQL Configuration (postgresql.production.conf)
# Hardened for Concurrency, PostGIS Spatial Indexing, WAL/PITR, and Security
# ==============================================================================

# --- Connection Settings ---
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 5

# --- Memory Settings (Tuned for 4GB RAM Dedicated DB Instance) ---
shared_buffers = 1GB
work_mem = 16MB
maintenance_work_mem = 256MB
effective_cache_size = 3GB
effective_io_concurrency = 200
random_page_cost = 1.1

# --- Write-Ahead Logging & Point-in-Time Recovery (PITR) ---
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min

# --- Query Planner & PostGIS Settings ---
default_statistics_target = 100
jit = off

# --- Logging & Audit ---
logging_collector = on
log_destination = 'csvlog'
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250 # Log queries exceeding 250ms
log_line_prefix = '%m [%p] %q%u@%d '
log_connections = on
log_disconnections = on
log_lock_waits = on

# --- TLS / SSL Enforcement ---
ssl = on
ssl_ciphers = 'HIGH:!aNULL:!MD5'
ssl_prefer_server_ciphers = on
