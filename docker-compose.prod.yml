# ==============================================================================
# LocalSaathi Production Deployment Stack (Docker Compose)
# Services: Next.js Web App, PostgreSQL (PostGIS), Redis
# ==============================================================================

version: '3.8'

services:
  # --- Next.js Full-Stack Application ---
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: localsaathi-web
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=postgresql://${DB_USER:-localsaathi_admin}:${DB_PASSWORD:-localsaathi_prod_password}@postgres:5432/${DB_NAME:-localsaathi_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-localsaathi_redis_password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - localsaathi-prod-net

  # --- Database (PostgreSQL 16 with PostGIS 3.4) ---
  postgres:
    image: postgis/postgis:16-3.4
    container_name: localsaathi-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-localsaathi_db}
      POSTGRES_USER: ${DB_USER:-localsaathi_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localsaathi_prod_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sh:/docker-entrypoint-initdb.d/init-postgis.sh
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-localsaathi_admin} -d ${DB_NAME:-localsaathi_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localsaathi-prod-net

  # --- Cache & Session Store (Redis 7.2 Alpine) ---
  redis:
    image: redis:7.2-alpine
    container_name: localsaathi-redis-prod
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"${REDIS_PASSWORD:-localsaathi_redis_password}\" --appendonly yes"]
    volumes:
      - redis_prod_data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-localsaathi_redis_password}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localsaathi-prod-net

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  localsaathi-prod-net:
    driver: bridge
