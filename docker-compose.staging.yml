# ==============================================================================
# LocalSaathi Staging / Local Production Simulation Stack
# Full microservice environment: Web, API, Worker, Postgres, Redis, OpenSearch, Nginx
# ==============================================================================

version: '3.8'

services:
  # --- Reverse Proxy (Nginx) ---
  nginx:
    image: nginx:1.27-alpine
    container_name: localsaathi-staging-nginx
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - localsaathi-staging-net

  # --- Frontend Web Application (Next.js) ---
  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
    container_name: localsaathi-staging-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_ENV=staging
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3000']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - localsaathi-staging-net

  # --- Backend REST & WebSocket API (NestJS) ---
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: localsaathi-staging-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_ENV=staging
      - API_PORT=4000
      - API_URL=http://localhost:4000
      - CORS_ALLOWED_ORIGINS=http://localhost,http://localhost:3000,http://127.0.0.1
      - DATABASE_URL=postgresql://${DB_USER:-localsaathi_admin}:${DB_PASSWORD:-localsaathi_dev_password}@postgres:5432/${DB_NAME:-localsaathi_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-localsaathi_redis_secret}@redis:6379/0
      - OPENSEARCH_URL=http://opensearch:9200
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-staging_jwt_access_secret_min_32_characters_random}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-staging_jwt_refresh_secret_min_32_characters_random}
      - AUTH_PEPPER=${AUTH_PEPPER:-staging_auth_pepper_min_32_characters_random_val}
      - SMS_PROVIDER=mock
      - BACKUP_STORAGE_DIR=/app/backups
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/v1/health/live']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - localsaathi-staging-net

  # --- Background Job & Outbox Worker (BullMQ) ---
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: localsaathi-staging-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - APP_ENV=staging
      - WORKER_PORT=4001
      - DATABASE_URL=postgresql://${DB_USER:-localsaathi_admin}:${DB_PASSWORD:-localsaathi_dev_password}@postgres:5432/${DB_NAME:-localsaathi_db}?schema=public
      - REDIS_URL=redis://:${REDIS_PASSWORD:-localsaathi_redis_secret}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - localsaathi-staging-net

  # --- Authoritative Database (PostgreSQL 16 + PostGIS 3.4) ---
  postgres:
    image: postgis/postgis:16-3.4
    container_name: localsaathi-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-localsaathi_db}
      POSTGRES_USER: ${DB_USER:-localsaathi_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-localsaathi_dev_password}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-postgis.sh:/docker-entrypoint-initdb.d/init-postgis.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-localsaathi_admin} -d ${DB_NAME:-localsaathi_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localsaathi-staging-net

  # --- Distributed Cache & Queue Broker (Redis 7.2) ---
  redis:
    image: redis:7.2-alpine
    container_name: localsaathi-staging-redis
    restart: unless-stopped
    volumes:
      - staging_redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-localsaathi_redis_secret}', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-localsaathi_redis_secret}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - localsaathi-staging-net

  # --- Search Subsystem (OpenSearch 2.18) ---
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: localsaathi-staging-opensearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - staging_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - localsaathi-staging-net

volumes:
  staging_postgres_data:
    driver: local
  staging_redis_data:
    driver: local
  staging_opensearch_data:
    driver: local

networks:
  localsaathi-staging-net:
    driver: bridge
